<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1410">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flip PDF">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Flip PDF</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e8b04a'/%3E%3Cpath d='M16 9c-2.5-1.6-5.5-2-9-1.5v15c3.5-.5 6.5-.1 9 1.5 2.5-1.6 5.5-2 9-1.5v-15c-3.5-.5-6.5-.1-9 1.5z' fill='none' stroke='%231a1410' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M16 9v15' stroke='%231a1410' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M16 9c-2.5-1.6-5.5-2-9-1.5v15c3.5-.5 6.5-.1 9 1.5 2.5-1.6 5.5-2 9-1.5v-15c-3.5-.5-6.5-.1-9 1.5z" fill="none" stroke="#1a1410" stroke-width="2" stroke-linejoin="round"/><path d="M16 9v15" stroke="#1a1410" stroke-width="2"/></svg>
    <span>Flip PDF</span>
  </div>
  <div class="title" id="title"></div>
  <div class="actions">
    <button class="btn" id="btnInstall" hidden title="Install Flip PDF as an app">Install app</button>
    <button class="btn" id="btnOpen" title="Open another PDF">Open PDF</button>
    <button class="btn icon-only book-only" id="btnMode" title="Toggle single page / two-page spread (M)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path id="modeIcon" d="M3 5h8v14H3zM13 5h8v14h-8z"/></svg>
    </button>
    <button class="btn icon-only" id="btnTheme" title="Toggle light / dark (T)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="btn icon-only book-only" id="btnFull" title="Fullscreen (F)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button class="btn primary book-only" id="btnExport" title="Save a single HTML file you can share or host anywhere">Export flipbook</button>
  </div>
</header>

<main class="stage" id="stage">
  <section id="landing" class="landing">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose a PDF">
      <svg viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M32 16c-5-3.2-11-4-18-3v36c7-1 13-.2 18 3 5-3.2 11-4 18-3V13c-7-1-13-.2-18 3z"/><path d="M32 16v36"/><path d="M40 7l9 4-4 9" /></svg>
      <h1>Turn your PDF into a flippable book</h1>
      <p>Drop your novel's PDF here, or</p>
      <button class="btn primary big" id="btnChoose">Choose a PDF</button>
      <small>Runs 100% on your computer. Nothing is uploaded, no watermark, no page limit.</small>
    </div>
  </section>

  <div id="bookHost" class="book-host"><div id="book"></div></div>
  <div id="reader" class="reader" hidden></div>

  <button class="nav prev book-only" id="navPrev" aria-label="Previous page">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="nav next book-only" id="navNext" aria-label="Next page">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</main>

<footer class="bar book-only" id="bar">
  <button class="btn icon-only sm" id="btnFirst" title="First page (Home)">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6l-6 6 6 6M7 6v12"/></svg>
  </button>
  <button class="btn icon-only sm" id="btnPrev" title="Previous (←)">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <input type="range" id="slider" min="1" max="1" value="1" aria-label="Page slider">
  <button class="btn icon-only sm" id="btnNext" title="Next (→)">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <button class="btn icon-only sm" id="btnLast" title="Last page (End)">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l6 6-6 6M17 6v12"/></svg>
  </button>
  <div class="counter">
    <span>Page</span>
    <input type="number" id="pageInput" min="1" value="1" aria-label="Go to page">
    <span id="pageTotal">/ 1</span>
  </div>
  <label class="quality" title="Higher quality is sharper but renders slower">
    <span>Quality</span>
    <select id="quality">
      <option value="1000">Light</option>
      <option value="1400">Standard</option>
      <option value="2000">High</option>
      <option value="2800">Max</option>
    </select>
  </label>
  <div class="prep" id="prep" aria-live="polite"></div>
</footer>

<div class="overlay" id="overlay" hidden>
  <div class="card">
    <div class="spinner"></div>
    <div id="overlayText">Working…</div>
    <div class="meter" id="meterWrap" hidden><div id="meter"></div></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<input type="file" id="file" accept="application/pdf,.pdf" hidden>

<script src="vendor/page-flip.browser.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
