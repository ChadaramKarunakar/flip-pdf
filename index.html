<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1410">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flip PDF">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Flip PDF</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark" class="view-library">

<header class="top">
  <a class="btn read-only back" id="btnBack" href="#/library" title="Back to your library">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span>Library</span>
  </a>
  <a class="brand" href="#/library" title="Library">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M16 9c-2.5-1.6-5.5-2-9-1.5v15c3.5-.5 6.5-.1 9 1.5 2.5-1.6 5.5-2 9-1.5v-15c-3.5-.5-6.5-.1-9 1.5z" fill="none" stroke="#1a1410" stroke-width="2" stroke-linejoin="round"/><path d="M16 9v15" stroke="#1a1410" stroke-width="2"/></svg>
    <span>Flip PDF</span>
  </a>
  <div class="title" id="title"></div>
  <div class="actions">
    <button class="btn" id="btnInstall" hidden title="Install Flip PDF as an app">Install app</button>
    <button class="btn primary lib-only" id="btnAdd" title="Add books from your device">+ Add books</button>

    <button class="btn icon-only read-only" id="btnBookmark" title="Bookmark this page (B)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path id="bmIcon" d="M6 3h12v18l-6-4-6 4z"/></svg>
    </button>
    <button class="btn icon-only read-only" id="btnHighlight" title="Highlight an area (H)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h6M14.5 4.5l5 5L10 19l-5 0 0-5z"/></svg>
    </button>
    <button class="btn icon-only read-only" id="btnNotes" title="Bookmarks and notes (N)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/></svg>
    </button>
    <button class="btn icon-only read-only" id="btnMode" title="Change view (M)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path id="modeIcon" d="M3 5h8v14H3zM13 5h8v14h-8z"/></svg>
    </button>
    <button class="btn icon-only" id="btnTheme" title="Toggle light / dark (T)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="btn icon-only read-only" id="btnFull" title="Fullscreen (F)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button class="btn read-only" id="btnExport" title="Save a single HTML file you can share or host anywhere">Export</button>
    <button class="btn icon-only read-only more-only" id="btnMore" aria-label="More options" aria-haspopup="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </button>
    <div class="moremenu" id="moreMenu" hidden>
      <button data-proxy="btnMode">Change view (curl / swipe)</button>
      <button data-proxy="btnTheme">Light / dark theme</button>
      <button data-proxy="btnFull">Fullscreen</button>
      <button data-proxy="btnExport">Export flipbook</button>
      <a href="#/library">Back to library</a>
    </div>
  </div>
</header>

<!-- ============ LIBRARY ============ -->
<main class="library" id="viewLibrary">
  <nav class="side" id="side" aria-label="Library sections"></nav>
  <section class="lib-main">
    <div class="scanbar" id="scanBar" hidden></div>
    <div class="lib-head">
      <h2 id="libTitle">Library</h2>
      <div class="lib-tools" id="libTools">
        <input id="search" type="search" placeholder="Search title, author or tag" aria-label="Search library">
        <select id="sort" aria-label="Sort books">
          <option value="recent">Recently read</option>
          <option value="added">Recently added</option>
          <option value="title">Title A–Z</option>
          <option value="author">Author A–Z</option>
          <option value="progress">Progress</option>
        </select>
        <select id="group" aria-label="Group books by">
          <option value="none">No grouping</option>
          <option value="author">Group by author</option>
          <option value="category">Group by category</option>
          <option value="status">Group by status</option>
        </select>
        <button class="btn icon-only" id="btnLayout" title="Grid / list"></button>
        <button class="btn" id="btnSelect" title="Select several books to organise">Select</button>
      </div>
    </div>
    <div id="tagRow" class="tagrow"></div>
    <div id="libBody" class="lib-body"></div>
  </section>
</main>

<button class="fab" id="fab" aria-label="Add books" title="Add books"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<!-- bulk actions -->
<div class="selbar" id="selbar" hidden>
  <span id="selCount">0 selected</span>
  <button class="btn" data-sel="shelf">Add to shelf</button>
  <button class="btn" data-sel="status">Set status</button>
  <button class="btn danger" data-sel="delete">Delete</button>
  <button class="btn" data-sel="cancel">Done</button>
</div>

<!-- ============ READER ============ -->
<main class="stage" id="stage">
  <div id="bookHost" class="book-host"><div id="book"></div></div>
  <div id="reader" class="reader" hidden></div>

  <button class="nav prev book-only" id="navPrev" aria-label="Previous page">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="nav next book-only" id="navNext" aria-label="Next page">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</main>

<footer class="bar book-only" id="bar">
  <button class="btn icon-only sm" id="btnFirst" title="First page (Home)">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6l-6 6 6 6M7 6v12"/></svg>
  </button>
  <button class="btn icon-only sm" id="btnPrev" title="Previous (←)">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <input type="range" id="slider" min="1" max="1" value="1" aria-label="Page slider">
  <button class="btn icon-only sm" id="btnNext" title="Next (→)">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <button class="btn icon-only sm" id="btnLast" title="Last page (End)">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l6 6-6 6M17 6v12"/></svg>
  </button>
  <div class="counter">
    <span>Page</span>
    <input type="number" id="pageInput" min="1" value="1" aria-label="Go to page">
    <span id="pageTotal">/ 1</span>
  </div>
  <label class="quality" title="Higher quality is sharper but renders slower">
    <span>Quality</span>
    <select id="quality">
      <option value="1000">Light</option>
      <option value="1400">Standard</option>
      <option value="2000">High</option>
      <option value="2800">Max</option>
    </select>
  </label>
  <div class="prep" id="prep" aria-live="polite"></div>
</footer>

<!-- notes & bookmarks drawer (reader) -->
<aside class="drawer" id="drawer" hidden aria-label="Bookmarks and notes"></aside>

<!-- book details sheet / generic dialogs -->
<div class="modal" id="sheet" hidden></div>
<div class="modal" id="dialog" hidden></div>

<div class="overlay" id="overlay" hidden>
  <div class="card">
    <div class="spinner"></div>
    <div id="overlayText">Working…</div>
    <div class="meter" id="meterWrap" hidden><div id="meter"></div></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<div class="dropveil" id="dropveil">Drop PDFs to add them to your library</div>

<input type="file" id="file" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="fileDir" webkitdirectory multiple hidden>
<input type="file" id="fileCover" accept="image/*" hidden>
<input type="file" id="fileRestore" accept=".zip,application/zip" hidden>

<script src="vendor/page-flip.browser.js"></script>
<script type="module" src="app.js"></script>
<script type="module" src="library.js"></script>
</body>
</html>
